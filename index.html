
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#058901">

  <title>IMIP QUIZ | MindAR V9</title>

  <link rel="stylesheet" href="style.css?v=8">

  <!-- A-Frame dan MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Desain 3D -->
  <script src="welcome-3d.js?v=8"></script>
  <script src="menu-3d.js?v=9"></script>
</head>

<body>

  <a-scene
    id="arScene"
    embedded
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse"
      raycaster="objects: .clickable; far: 10000">
    </a-camera>

    <!-- TARGET LOGO IMIP -->
    <a-entity
      id="imipTarget"
      mindar-image-target="targetIndex: 0">

      <!-- PENCAHAYAAN 3D -->
      <a-light
        type="ambient"
        intensity="0.82"
        color="#FFFFFF">
      </a-light>

      <a-light
        type="point"
        position="-0.75 0.85 1.3"
        intensity="0.68"
        color="#FFFFFF"
        distance="3">
      </a-light>

      <!-- ================================
           WELCOME V8 (TETAP)
      ================================= -->

      <a-entity
        id="welcome3d"
        position="0 0 0.10"
        visible="true">

        <a-entity
          id="welcomeFloat"
          imip-welcome-3d
          animation__float="
            property: position;
            from: 0 0 0;
            to: 0 0 0.016;
            dir: alternate;
            dur: 2400;
            loop: true;
            easing: easeInOutSine"
          animation__tilt="
            property: rotation;
            from: 0 -2.5 0;
            to: 0 2.5 0;
            dir: alternate;
            dur: 3800;
            loop: true;
            easing: easeInOutSine">

          <a-entity
            id="startButton3d"
            position="0 -0.48 0.12"
            animation__pulse="
              property: scale;
              from: 1 1 1;
              to: 1.055 1.055 1.055;
              dir: alternate;
              dur: 850;
              loop: true;
              easing: easeInOutSine">

            <a-plane
              id="start3dHit"
              class="clickable"
              data-action="start"
              position="0 0.005 0.20"
              width="1.00"
              height="0.27"
              material="
                shader: flat;
                opacity: 0;
                transparent: true;
                depthWrite: false;
                side: double">
            </a-plane>

          </a-entity>
        </a-entity>
      </a-entity>

      <!-- ================================
           MENU UTAMA 3D V9
      ================================= -->

      <a-entity
        id="menu3d"
        position="0 0 0.10"
        visible="false">

        <a-entity
          id="menuFloat"
          imip-menu-3d
          animation__float="
            property: position;
            from: 0 0 0;
            to: 0 0 0.012;
            dir: alternate;
            dur: 2600;
            loop: true;
            easing: easeInOutSine"
          animation__tilt="
            property: rotation;
            from: 0 -1.8 0;
            to: 0 1.8 0;
            dir: alternate;
            dur: 4200;
            loop: true;
            easing: easeInOutSine">

          <!-- PLAKAT LOGO MINI -->
          <a-text
            value="IMIP"
            position="0 0.541 0.166"
            align="center"
            width="0.26"
            color="#058901">
          </a-text>

          <!-- JUDUL CADANGAN -->
          <a-text
            id="menuTitleFallback"
            value="IMIP QUIZ"
            position="0 0.394 0.185"
            align="center"
            width="0.96"
            color="#058901">
          </a-text>

          <a-text
            value="PILIH MODUL"
            position="0 0.247 0.179"
            align="center"
            width="0.77"
            color="#058901">
          </a-text>

          <!-- ==========================
               KARTU 1: BELAJAR PP
          =========================== -->

          <a-entity
            id="cardLearnPP"
            position="-0.267 0.081 0">

            <a-text
              value="BELAJAR&#10;PERATURAN&#10;PERUSAHAAN"
              position="0 0.010 0.219"
              align="center"
              anchor="center"
              baseline="center"
              width="0.45"
              color="#045B12">
            </a-text>

            <a-plane
              class="clickable"
              data-action="learn-pp"
              width="0.515"
              height="0.246"
              position="0 0 0.270"
              material="
                shader: flat;
                transparent: true;
                opacity: 0;
                depthWrite: false;
                side: double">
            </a-plane>

          </a-entity>

          <!-- ==========================
               KARTU 2: BELAJAR K3
          =========================== -->

          <a-entity
            id="cardLearnK3"
            position="0.267 0.081 0">

            <a-text
              value="BELAJAR&#10;KESELAMATAN&#10;KERJA (K3)"
              position="0 0.010 0.219"
              align="center"
              anchor="center"
              baseline="center"
              width="0.45"
              color="#045B12">
            </a-text>

            <a-plane
              class="clickable"
              data-action="learn-k3"
              width="0.515"
              height="0.246"
              position="0 0 0.270"
              material="
                shader: flat;
                transparent: true;
                opacity: 0;
                depthWrite: false;
                side: double">
            </a-plane>

          </a-entity>

          <!-- ==========================
               KARTU 3: LATIHAN PP
          =========================== -->

          <a-entity
            id="cardQuizPP"
            position="-0.267 -0.185 0">

            <a-text
              value="LATIHAN SOAL&#10;PERATURAN&#10;PERUSAHAAN"
              position="0 0.010 0.219"
              align="center"
              anchor="center"
              baseline="center"
              width="0.45"
              color="#045B12">
            </a-text>

            <a-plane
              class="clickable"
              data-action="quiz-pp"
              width="0.515"
              height="0.246"
              position="0 0 0.270"
              material="
                shader: flat;
                transparent: true;
                opacity: 0;
                depthWrite: false;
                side: double">
            </a-plane>

          </a-entity>

          <!-- ==========================
               KARTU 4: LATIHAN K3
          =========================== -->

          <a-entity
            id="cardQuizK3"
            position="0.267 -0.185 0">

            <a-text
              value="LATIHAN SOAL&#10;KESELAMATAN&#10;KERJA (K3)"
              position="0 0.010 0.219"
              align="center"
              anchor="center"
              baseline="center"
              width="0.45"
              color="#045B12">
            </a-text>

            <a-plane
              class="clickable"
              data-action="quiz-k3"
              width="0.515"
              height="0.246"
              position="0 0 0.270"
              material="
                shader: flat;
                transparent: true;
                opacity: 0;
                depthWrite: false;
                side: double">
            </a-plane>

          </a-entity>

          <!-- PETUNJUK MENU -->
          <a-text
            value="SENTUH KARTU UNTUK MEMULAI"
            position="0 -0.412 0.154"
            align="center"
            width="0.84"
            color="#226432">
          </a-text>

        </a-entity>
      </a-entity>

      <!-- ================================
           PAPAN MATERI DAN SOAL
           TETAP V8
      ================================= -->

      <a-entity
        id="content3d"
        position="0 0 0.10"
        visible="false">

        <a-box
          width="1.08"
          height="1.45"
          depth="0.025"
          color="#FFFFFF">
        </a-box>

        <a-plane
          position="0 0.59 0.025"
          width="1.08"
          height="0.26"
          color="#058901">
        </a-plane>

        <a-text
          id="worldMode"
          value="BELAJAR"
          position="-0.47 0.665 0.04"
          width="0.93"
          color="#FFE2A6">
        </a-text>

        <a-text
          id="worldTitle"
          value="Judul"
          position="-0.47 0.56 0.04"
          width="0.93"
          wrap-count="29"
          color="#FFFFFF">
        </a-text>

        <a-text
          id="worldBody"
          value="Isi akan muncul di sini."
          position="-0.46 0.40 0.04"
          baseline="top"
          width="0.91"
          wrap-count="35"
          color="#184C2B">
        </a-text>

        <a-text
          id="worldHint"
          value=""
          position="-0.46 0.025 0.04"
          baseline="top"
          width="0.91"
          wrap-count="35"
          color="#55735C">
        </a-text>

        <!-- JAWABAN A, B, C -->

        <a-entity
          id="worldChoices"
          visible="false">

          <a-plane
            id="option0"
            class="clickable"
            data-action="answer-0"
            position="0 -0.135 0.045"
            width="0.94"
            height="0.145"
            color="#EBF8DC">
          </a-plane>

          <a-text
            id="optionText0"
            value="A"
            position="-0.44 -0.15 0.055"
            width="0.88"
            wrap-count="36"
            color="#058901">
          </a-text>

          <a-plane
            id="option1"
            class="clickable"
            data-action="answer-1"
            position="0 -0.315 0.045"
            width="0.94"
            height="0.145"
            color="#EBF8DC">
          </a-plane>

          <a-text
            id="optionText1"
            value="B"
            position="-0.44 -0.33 0.055"
            width="0.88"
            wrap-count="36"
            color="#058901">
          </a-text>

          <a-plane
            id="option2"
            class="clickable"
            data-action="answer-2"
            position="0 -0.495 0.045"
            width="0.94"
            height="0.145"
            color="#EBF8DC">
          </a-plane>

          <a-text
            id="optionText2"
            value="C"
            position="-0.44 -0.51 0.055"
            width="0.88"
            wrap-count="36"
            color="#058901">
          </a-text>

        </a-entity>

        <!-- KEMBALI -->

        <a-plane
          class="clickable"
          data-action="home"
          position="-0.25 -0.635 0.045"
          width="0.46"
          height="0.12"
          color="#DCEBDD">
        </a-plane>

        <a-text
          value="MENU"
          position="-0.25 -0.655 0.055"
          align="center"
          width="0.40"
          color="#058901">
        </a-text>

        <!-- LANJUT -->

        <a-entity id="nextGroup">

          <a-plane
            class="clickable"
            data-action="next"
            position="0.25 -0.635 0.045"
            width="0.46"
            height="0.12"
            color="#FD9802">
          </a-plane>

          <a-text
            id="nextText"
            value="LANJUT"
            position="0.25 -0.655 0.055"
            align="center"
            width="0.40"
            color="#FFFFFF">
          </a-text>

        </a-entity>

      </a-entity>

    </a-entity>

  </a-scene>

  <!-- HEADER -->
  <header class="app-header">

    <div class="brand">
      <strong>IMIP QUIZ</strong>
      <small>PEMBELAJARAN & LATIHAN HRD</small>
    </div>

    <span
      class="status"
      id="markerStatus"
      aria-live="polite">
      Menyiapkan kamera...
    </span>

  </header>

  <!-- PANEL SENTUH -->
  <section
    id="touchDock"
    class="touch-dock collapsed"
    aria-label="Kontrol IMIP QUIZ"
    hidden>

    <div class="dock-header">

      <div>
        <small>KONTROL SENTUH</small>
        <strong id="dockTitle">Menu IMIP QUIZ</strong>
      </div>

      <button
        id="toggleDock"
        type="button"
        aria-label="Buka atau tutup panel">
        +
      </button>

    </div>

    <div class="dock-content">

      <p id="dockDescription">
        Pilih modul pembelajaran atau latihan.
      </p>

      <div
        id="touchActions"
        class="touch-actions">
      </div>

      <p class="note">
        Simulasi akademik; bukan SOP resmi PT IRNC.
      </p>

    </div>

  </section>

  <!-- TOMBOL MULAI CADANGAN -->
  <button
    id="startBackup"
    type="button"
    class="start-backup"
    hidden>

    <span aria-hidden="true">▶</span>
    MULAI QUIZ

  </button>

  <script src="app.js?v=8"></script>

</body>
</html>
