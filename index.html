<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#058901">
  <title>IMIP QUIZ | MindAR V6</title>
  <link rel="stylesheet" href="style.css?v=6">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <!-- Tidak ada splash HTML: kamera AR langsung terbuka. -->
  <a-scene
    id="arScene"
    embedded
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="20000">
      <!-- Gambar persis dari referensi pengguna, bukan gambar yang digambar ulang. -->
      <img id="welcomeArt" src="./welcome-imip.png" alt="IMIP QUIZ">
      <img id="mulaiArt" src="./welcome-mulai-v6.png" alt="MULAI">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse"
      raycaster="objects: .clickable; far: 10000">
    </a-camera>

    <a-entity id="imipTarget" mindar-image-target="targetIndex: 0">
      <!-- Pencahayaan untuk lapisan dan objek 3D, bukan untuk mengubah gambar asli. -->
      <a-light type="ambient" intensity="0.82" color="#FFFFFF"></a-light>
      <a-light type="point" position="-0.75 0.85 1.3" intensity="0.68"
               color="#FFFFFF" distance="3"></a-light>

      <!-- =====================================================
           PEMBUKA V6: GAMBAR ORIGINAL + KEDALAMAN 3D SUNGGUHAN
           Gambar original welcome-imip.png TIDAK diubah.
      ====================================================== -->
      <a-entity id="welcome3d" position="0 0 0.09">
        <a-entity
          id="welcomeFloat"
          animation__float="property: position; from: 0 0 0; to: 0 0 0.018; dir: alternate; dur: 2600; easing: easeInOutSine; loop: true"
          animation__tilt="property: rotation; from: 0 -3 0; to: 0 3 0; dir: alternate; dur: 4000; easing: easeInOutSine; loop: true">

          <!-- Lapisan bingkai fisik: memberikan ketebalan yang terlihat saat miring. -->
          <a-box position="0 -0.013 -0.055" width="1.31" height="0.995"
                 depth="0.070" color="#034519"
                 material="metalness: 0.25; roughness: 0.45"></a-box>
          <a-box position="0 -0.006 -0.026" width="1.285" height="0.970"
                 depth="0.035" color="#FD9802"
                 material="metalness: 0.12; roughness: 0.38"></a-box>
          <a-box position="0 -0.001 -0.009" width="1.265" height="0.951"
                 depth="0.018" color="#86D101"
                 material="metalness: 0.12; roughness: 0.35"></a-box>

          <!-- Desain visual SAMA PERSIS seperti gambar pilihanmu. -->
          <a-image id="welcomeBoard" src="#welcomeArt"
                   position="0 0 0.008" width="1.25" height="0.9375"
                   material="shader: flat; side: double"></a-image>

          <!-- Beberapa kubus REAL 3D mengikuti dekorasi yang sudah ada di gambar. -->
          <a-box position="-0.420 0.255 0.082" width="0.090" height="0.090"
                 depth="0.092" rotation="23 28 18" color="#86D101"
                 material="metalness: 0.20; roughness: 0.34"
                 animation="property: rotation; to: 38 60 40; dur: 3800; dir: alternate; loop: true; easing: easeInOutSine"></a-box>
          <a-box position="0.455 0.258 0.082" width="0.084" height="0.084"
                 depth="0.086" rotation="17 35 26" color="#FFAA13"
                 material="metalness: 0.20; roughness: 0.34"
                 animation="property: rotation; to: 35 58 8; dur: 4200; dir: alternate; loop: true; easing: easeInOutSine"></a-box>
          <a-octahedron position="-0.505 -0.285 0.062" radius="0.046"
                        color="#FD9802" rotation="15 24 28"
                        animation="property: rotation; to: 35 70 45; dur: 3600; dir: alternate; loop: true"></a-octahedron>
          <a-octahedron position="0.483 -0.290 0.062" radius="0.044"
                        color="#86D101" rotation="26 15 20"
                        animation="property: rotation; to: 42 65 48; dur: 3900; dir: alternate; loop: true"></a-octahedron>

          <!-- Tombol dari POTONGAN GAMBAR ORIGINAL dengan bagian luar transparan.
               Gambar hanyalah tampilan, bukan area sentuh. -->
          <a-entity id="mulaiAnimated" position="-0.0207 -0.2875 0.095"
            animation="property: scale; from: 1.03 1.03 1; to: 1.115 1.115 1; dir: alternate; dur: 850; easing: easeInOutSine; loop: true">

            <!-- Tebal tombol 3D di belakang desain original. -->
            <a-box position="0 -0.013 -0.019" width="0.635" height="0.178"
                   depth="0.040" color="#0B641C"
                   material="metalness: 0.12; roughness: 0.42"></a-box>
            <a-box position="0 -0.016 -0.007" width="0.648" height="0.188"
                   depth="0.018" color="#FC8C05"
                   material="metalness: 0.10; roughness: 0.48"></a-box>
            <a-image src="#mulaiArt" position="0 0 0.027"
                     width="0.6561" height="0.2314"
                     material="shader: flat; transparent: true; alphaTest: 0.02; side: double"></a-image>

            <!-- HITBOX INVISIBLE JAUH LEBIH LUAS daripada tombol visual.
                 Posisi di depan gambar; tidak mengubah desain. -->
            <a-plane id="start3dHit" class="clickable" data-action="start"
                     position="0 0 0.061" width="0.92" height="0.34"
                     material="color: #FFFFFF; transparent: true; opacity: 0; depthWrite: false; side: double"></a-plane>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- EMPAT MENU 3D: muncul setelah tombol MULAI ditekan. -->
      <a-entity id="menu3d" position="0 0 0.08" visible="false">
        <a-box width="1.07" height="0.82" depth="0.025" color="#058901"></a-box>
        <a-box position="0 0.395 0.025" width="1.07" height="0.025" depth="0.01" color="#FD9802"></a-box>
        <a-text value="IMIP QUIZ" position="0 0.315 0.04" align="center" width="1.0" color="#FFFFFF"></a-text>
        <a-text value="PILIH MODUL" position="0 0.23 0.04" align="center" width="0.78" color="#FFE0A0"></a-text>

        <a-plane class="clickable" data-action="learn-pp" position="-0.25 0.095 0.045" width="0.47" height="0.21" color="#FFFFFF"></a-plane>
        <a-text value="BELAJAR&#10;PERATURAN&#10;PERUSAHAAN" position="-0.25 0.095 0.055" align="center" anchor="center" baseline="center" width="0.46" color="#075F18"></a-text>

        <a-plane class="clickable" data-action="learn-k3" position="0.25 0.095 0.045" width="0.47" height="0.21" color="#86D101"></a-plane>
        <a-text value="BELAJAR&#10;KESELAMATAN&#10;KERJA (K3)" position="0.25 0.095 0.055" align="center" anchor="center" baseline="center" width="0.46" color="#075F18"></a-text>

        <a-plane class="clickable" data-action="quiz-pp" position="-0.25 -0.16 0.045" width="0.47" height="0.21" color="#FFFFFF"></a-plane>
        <a-text value="LATIHAN SOAL&#10;PERATURAN&#10;PERUSAHAAN" position="-0.25 -0.16 0.055" align="center" anchor="center" baseline="center" width="0.46" color="#075F18"></a-text>

        <a-plane class="clickable" data-action="quiz-k3" position="0.25 -0.16 0.045" width="0.47" height="0.21" color="#86D101"></a-plane>
        <a-text value="LATIHAN SOAL&#10;KESELAMATAN&#10;KERJA (K3)" position="0.25 -0.16 0.055" align="center" anchor="center" baseline="center" width="0.46" color="#075F18"></a-text>

        <a-text value="SENTUH KARTU UNTUK MEMULAI" position="0 -0.335 0.045" align="center" width="0.88" color="#FFFFFF"></a-text>
      </a-entity>

      <!-- MATERI, PILIHAN JAWABAN, HASIL (kode kompatibel dengan V4) -->
      <a-entity id="content3d" position="0 0 0.10" visible="false">
        <a-box width="1.08" height="1.45" depth="0.025" color="#FFFFFF"></a-box>
        <a-plane position="0 0.59 0.025" width="1.08" height="0.26" color="#058901"></a-plane>
        <a-text id="worldMode" value="BELAJAR" position="-0.47 0.665 0.04" width="0.93" color="#FFE2A6"></a-text>
        <a-text id="worldTitle" value="Judul" position="-0.47 0.56 0.04" width="0.93" wrap-count="29" color="#FFFFFF"></a-text>
        <a-text id="worldBody" value="Isi akan muncul di sini." position="-0.46 0.40 0.04" baseline="top" width="0.91" wrap-count="35" color="#184C2B"></a-text>
        <a-text id="worldHint" value="" position="-0.46 0.025 0.04" baseline="top" width="0.91" wrap-count="35" color="#55735C"></a-text>

        <a-entity id="worldChoices" visible="false">
          <a-plane id="option0" class="clickable" data-action="answer-0" position="0 -0.135 0.045" width="0.94" height="0.145" color="#EBF8DC"></a-plane>
          <a-text id="optionText0" value="A" position="-0.44 -0.15 0.055" width="0.88" wrap-count="36" color="#058901"></a-text>
          <a-plane id="option1" class="clickable" data-action="answer-1" position="0 -0.315 0.045" width="0.94" height="0.145" color="#EBF8DC"></a-plane>
          <a-text id="optionText1" value="B" position="-0.44 -0.33 0.055" width="0.88" wrap-count="36" color="#058901"></a-text>
          <a-plane id="option2" class="clickable" data-action="answer-2" position="0 -0.495 0.045" width="0.94" height="0.145" color="#EBF8DC"></a-plane>
          <a-text id="optionText2" value="C" position="-0.44 -0.51 0.055" width="0.88" wrap-count="36" color="#058901"></a-text>
        </a-entity>

        <a-plane class="clickable" data-action="home" position="-0.25 -0.635 0.045" width="0.46" height="0.12" color="#DCEBDD"></a-plane>
        <a-text value="MENU" position="-0.25 -0.655 0.055" align="center" width="0.40" color="#058901"></a-text>
        <a-entity id="nextGroup">
          <a-plane class="clickable" data-action="next" position="0.25 -0.635 0.045" width="0.46" height="0.12" color="#FD9802"></a-plane>
          <a-text id="nextText" value="LANJUT" position="0.25 -0.655 0.055" align="center" width="0.40" color="#FFFFFF"></a-text>
        </a-entity>
      </a-entity>

    </a-entity>
  </a-scene>

  <header class="app-header">
    <div class="brand">
      <strong>IMIP QUIZ</strong>
      <small>PEMBELAJARAN & LATIHAN HRD</small>
    </div>
    <span class="status" id="markerStatus" aria-live="polite">Menyiapkan kamera...</span>
  </header>

  <!-- Kontrol cadangan untuk materi/soal, tidak menutup pembuka AR. -->
  <section id="touchDock" class="touch-dock collapsed" aria-label="Kontrol IMIP QUIZ" hidden>
    <div class="dock-header">
      <div>
        <small>KONTROL SENTUH</small>
        <strong id="dockTitle">Menu IMIP QUIZ</strong>
      </div>
      <button id="toggleDock" type="button" aria-label="Buka atau tutup panel">+</button>
    </div>
    <div class="dock-content">
      <p id="dockDescription">Pilih modul pembelajaran atau latihan.</p>
      <div id="touchActions" class="touch-actions"></div>
      <p class="note">Simulasi akademik; bukan SOP resmi PT IRNC.</p>
    </div>
  </section>

  <!-- Kontrol cadangan hanya terlihat saat logo ditemukan pada welcome AR.
       Tombol utama tetap tombol 3D di atas logo. -->
  <button id="startBackup" type="button" class="start-backup" hidden>
    <span aria-hidden="true">▶</span> MULAI QUIZ
  </button>

  <script src="app.js?v=6"></script>
</body>
</html>
